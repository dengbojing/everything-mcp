[project]
name = "everything-es-mcp"
version = "0.1.0"
description = "Read-only Windows Everything search over MCP stdio"
requires-python = ">=3.11"
dependencies = ["mcp>=1.10.1,<2", "pypinyin>=0.55,<1"]

[project.scripts]
everything-mcp = "everything_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["everything_mcp.py"]
