name: Check and publish

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Windows tests and build
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    env:
      UV_PYTHON: '3.12'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.10'
      - name: Install dependencies
        run: uv sync --locked
      - name: Check unpublished version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'dengbojing/everything-mcp'
        run: |
          $tag = uv run --locked python -c "import re,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', v), 'Automated releases require X.Y.Z'; print('v'+v)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$([string]::IsNullOrWhiteSpace($existing).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Lint
        run: uv run --locked ruff check src tests
      - name: Check formatting
        run: uv run --locked ruff format --check src tests
      - name: Run offline tests
        run: uv run --locked python -m unittest discover -v
      - name: Build distributions
        run: uv build --no-sources
      - name: Validate distribution metadata
        run: uvx --from twine twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/evryth-mcp/
    permissions:
      id-token: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create tag and GitHub Release
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download published distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Create release at the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
